name: Publish Wiki

# Mirror docs/ + README.md into the GitHub wiki (separate `*.wiki.git` repo).
# The wiki must be enabled once: Settings -> Features -> Wikis (create the
# first page), otherwise the clone step fails with a clear message.
#
# Auth: the default GITHUB_TOKEN is used when it can write the wiki repo. If
# your org blocks that, add a repo secret `WIKI_TOKEN` (a classic PAT with
# `repo` scope, or a fine-grained token with Contents: read/write) — the script
# prefers it automatically.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/publish-wiki.mjs'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Render docs and push the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Keep the branch green until the wiki is switched on once:
      # Settings -> Features -> Wikis (create the first page).
      - name: Check whether the wiki is enabled
        id: wiki
        run: |
          if git ls-remote "https://github.com/${{ github.repository }}.wiki.git" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki not enabled::Enable Settings -> Features -> Wikis to publish docs."
          fi

      - name: Publish docs to wiki
        if: steps.wiki.outputs.enabled == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-wiki.mjs --push
