name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, and verify docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The `core/` submodule is documented and checked from here.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # fmt + clippy (-D warnings) + Rust tests + web unit tests + JSON + doc links.
      - name: Run checks
        run: ./build.sh check

      # The offline check deliberately skips the @noble-backed crypto tests
      # (it never installs node_modules). Run the full web suite with the real
      # dependencies here so the browser E2E crypto constructions — sealed-box
      # DMs, signature domains, backups, attachments — gate CI with 0 skipped.
      - name: Web tests with dependencies (crypto constructions)
        run: |
          (cd web && npm ci --no-audit --no-fund)
          node --test $(find web/test -name '*.test.mjs')

  web-build:
    name: Browser build (best effort)
    runs-on: ubuntu-latest
    # The @nymproject packages are large and versioned independently of this
    # repo; keep this advisory so a package-registry issue does not mask the
    # deterministic Rust/doc checks above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build
        run: ./build.sh web

  android:
    name: Android build (Capacitor 8, API 36)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Capacitor 8 compiles the app with Java 21 (see app/capacitor.build.gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build web bundle + sync Capacitor
        run: |
          (cd web && npm ci --no-audit --no-fund)
          (cd web && npm run build)
          (cd web && npx cap sync android)
      # Debug build: compiles all sources + the native Keystore plugin.
      - name: Assemble debug APK
        run: |
          chmod +x web/android/gradlew
          (cd web/android && ./gradlew --no-daemon assembleDebug)
      # Release build with no keystore = the exact F-Droid path: an unsigned
      # release APK, with versionCode/versionName derived from ./VERSION.
      - name: Assemble release APK (F-Droid path)
        run: (cd web/android && ./gradlew --no-daemon assembleRelease)
      - name: Verify outputs and stamped version
        run: |
          ls -l web/android/app/build/outputs/apk/release/
          test -f web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$AAPT" dump badging web/android/app/build/outputs/apk/release/app-release-unsigned.apk | grep -E "package: name='com.tribewarez.nysiris'"
