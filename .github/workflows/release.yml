name: Release

# Cut a release by tagging: `./build.sh bump <version> && git push origin v<version>`
# (VERSION file is the single source of truth; build.sh exports it as APP_VERSION.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    name: Checks (must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./build.sh check

  linux-deb:
    name: Linux .deb
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./build.sh desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

  windows-zip:
    name: Windows zip (MSYS2)
    needs: check
    runs-on: windows-latest
    env:
      # MSYS2's default shell PATH ignores GITHUB_PATH additions, so the
      # rust-toolchain action's cargo would be invisible. Inherit the runner
      # PATH (still prefixed with the MSYS2 bin dirs by setup-msys2).
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nodejs
            git
            zip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: ./build.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android APK/AAB
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # No android-actions/setup-android: the hosted ubuntu-latest image
      # already ships a full SDK (/usr/local/lib/android/sdk, licenses
      # accepted), and the action's sdkmanager 16 run fails on the removed
      # 'tools' package.
      # Optional signing: add the ANDROID_KEYSTORE_* repository secrets to
      # produce an installable, signed APK/AAB (see android/README.md). Without
      # them the build stays unsigned and a debug-signed APK is staged as a
      # sideloadable fallback. Staged as dist/nysiris_*_android*.
      - name: Prepare signing keystore (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ANDROID_KEYSTORE_BASE64 secret; the release APK/AAB will be UNSIGNED (a debug-signed APK is staged as a fallback)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nysiris.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nysiris.keystore" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build Android release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh android --release
      - name: Verify APK signature (when signed)
        if: steps.keystore.outputs.configured == 'true'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs dist/nysiris_*_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*android*

  publish:
    name: Publish GitHub release
    needs: [linux-deb, windows-zip, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.deb *.zip *.apk *.aab > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.zip
            *.apk
            *.aab
            SHA256SUMS.txt
          fail_on_unmatched_files: true
