// Release signing is opt-in via the environment (see android/README.md):
//   ANDROID_KEYSTORE_PATH       path to the .jks/.keystore (absolute, or
//                               relative to this app module)
//   ANDROID_KEYSTORE_PASSWORD   keystore password
//   ANDROID_KEY_ALIAS           key alias (default: nysiris)
//   ANDROID_KEY_PASSWORD        key password (default: keystore password)
// Without a keystore no release APK is produced at all — the build script
// (scripts/cmd-android.sh) ships the debug-signed APK instead, because an
// unsigned APK is uninstallable.
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystoreReady = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()
if (keystorePath != null && !keystorePath.isEmpty() && !keystoreReady) {
    logger.warn("ANDROID_KEYSTORE_PATH '$keystorePath' not found; building UNSIGNED release")
}

// Version: -PandroidVersionCode / -PandroidVersionName override; otherwise
// derive from the repo VERSION file so a bare `gradle assembleRelease` (e.g. on
// the F-Droid build server, which does not use ./build.sh) stamps the correct
// monotonic versionCode = major*1000000 + minor*1000 + patch.
def versionFile = file('../../../VERSION')
def derivedVersionName = versionFile.exists() ? versionFile.text.trim() : '1.0'
def versionMatcher = (derivedVersionName =~ /^(\d+)\.(\d+)\.(\d+)/)
def derivedVersionCode = versionMatcher
        ? versionMatcher[0][1].toInteger() * 1000000 + versionMatcher[0][2].toInteger() * 1000 + versionMatcher[0][3].toInteger()
        : 1
if (derivedVersionCode < 1) {
    derivedVersionCode = 1
}

apply plugin: 'com.android.application'

android {
    namespace = "com.tribewarez.nysiris"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tribewarez.nysiris"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = project.hasProperty('androidVersionCode') ? project.property('androidVersionCode').toString().toInteger() : derivedVersionCode
        versionName = project.hasProperty('androidVersionName') ? project.property('androidVersionName').toString() : derivedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Populated only when ANDROID_KEYSTORE_PATH points at a file.
            // NOTE: everything referencing `signingConfigs` must stay inside
            // this android { } block — it does not resolve as a project
            // property outside it (Gradle: "unknown property 'signingConfigs'").
            if (keystoreReady) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "nysiris"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

