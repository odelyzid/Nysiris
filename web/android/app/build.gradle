// Release signing is opt-in via the environment (see android/README.md):
//   ANDROID_KEYSTORE_PATH       path to the .jks/.keystore (absolute, or
//                               relative to this app module)
//   ANDROID_KEYSTORE_PASSWORD   keystore password
//   ANDROID_KEY_ALIAS           key alias (default: nysiris)
//   ANDROID_KEY_PASSWORD        key password (default: keystore password)
// Without a keystore the release output stays UNSIGNED (Android blocks its
// install); scripts/cmd-android.sh then also stages a debug-signed APK as a
// sideloadable fallback.
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystoreReady = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()
if (keystorePath != null && !keystorePath.isEmpty() && !keystoreReady) {
    logger.warn("ANDROID_KEYSTORE_PATH '$keystorePath' not found; building UNSIGNED release")
}

apply plugin: 'com.android.application'

android {
    namespace "app.example.nysiris"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.example.nysiris"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (project.hasProperty('androidVersionCode') ? project.property('androidVersionCode').toString().toInteger() : 1)
        versionName (project.hasProperty('androidVersionName') ? project.property('androidVersionName').toString() : "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Populated below only when ANDROID_KEYSTORE_PATH points at a file.
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (keystoreReady) {
    signingConfigs.release.storeFile = file(keystorePath)
    signingConfigs.release.storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    signingConfigs.release.keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "nysiris"
    signingConfigs.release.keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
