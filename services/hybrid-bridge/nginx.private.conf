# Private-only nginx: serves the local app on the isolated `backend` network.
# No TLS here on purpose — there is no clearnet peer. Transport privacy comes
# from Sphinx (client→bridge→app stays inside Docker). Terminate nothing publicly.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # bind is container-local; compose publishes NO ports, so this is
    # reachable only as http://app:80 from the bridge container.
    # The explicit IPv6 listen also stops the image entrypoint from trying
    # to rewrite this file (it is mounted read-only).

    # Core-only directives: no third-party modules required.
    server_tokens off;

    # Minimal logs, no client IPs stored (only internal bridge hits anyway).
    access_log off;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    # Static + simple API-style GETs. No proxy, no upstream, no external fetch.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Block hidden files and common sensitive paths even internally.
    location ~ /\. {
        deny all;
    }
    location ~* (\.env$|\.git|docker-compose.*|Dockerfile) {
        deny all;
    }
}
