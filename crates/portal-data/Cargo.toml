[package]
name = "portal-data"
version = "0.1.0"
# Explicit (not workspace-inherited) so the crate also builds standalone
# inside service Docker images, where the workspace root is not copied.
edition = "2021"
license = "Apache-2.0"
description = "Portal data model: content-addressed signed objects, append-only logs, LWW-map (docs/10-portal.md)."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "3"
