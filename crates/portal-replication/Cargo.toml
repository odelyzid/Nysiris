[package]
name = "portal-replication"
version = "0.1.0"
# Explicit (not workspace-inherited) so the crate also builds standalone
# inside service Docker images, where the workspace root is not copied.
edition = "2021"
license = "Apache-2.0"
description = "Client-driven gossip sync for portal data: want-lists, verified apply, convergent heads (docs/10-portal.md)."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
portal-data = { path = "../portal-data" }

[dev-dependencies]
ed25519-dalek = "3"
