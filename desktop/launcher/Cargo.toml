[package]
name = "fly-protocol-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local static server + launcher that runs the fly-protocol PWA in a Chromium app window (Linux desktop)."
publish = false

# Dependency-free (std only): tiny build, trivial to package into a .deb.
[dependencies]

[[bin]]
name = "fly-protocol-launcher"
path = "src/main.rs"

[dev-dependencies]
