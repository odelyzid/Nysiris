[workspace]
resolver = "2"
members = ["crates/sphinx-core", "crates/bridge-guard", "crates/nym-hidden-service", "crates/portal-data", "crates/portal-replication", "crates/portal-reputation", "desktop/launcher"]
# Service/browser crates are standalone: they pull the heavy nym-sdk/mixnet
# toolchain and must not slow down or couple to the reference core's build.
exclude = ["services/echo-provider", "services/hybrid-bridge", "services/acceptance", "services/social", "services/portal-provider", "crates/sphinx-core/fuzz"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tribewarez/fly-protocol"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
